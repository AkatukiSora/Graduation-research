openapi: 3.0.3
info:
  title: Bicycle Stop Point Warning API
  version: v1
  description: >
    自転車利用者向けに、一時停止警告対象地点 (StopPoint) を返す取得専用 API。
    現時点では StopPoint の ID検索と範囲検索のみを扱う。
    地点は PostgreSQL (PostGIS) に投入された規制データセットのうち、
    設定 STOP_POINT_DATASET_ID で指定した 1 つの版だけから返す。
    応答には、通知判定に必要な最小限の値 (識別子・座標・方位・方位の確からしさ) だけを含める。
    方位 (az) が不明な地点は az を null、directionStatus を unknown で返す。
    データの出所・生成方法・根拠・データセット版などの内部情報は応答に含めず、データベース側にだけ保持する。
    通知可否はこの API では判定しない。directionStatus=inferred の方位は推定値であり、
    実道路の進行・接近方向や規制の現行性を保証しない。
servers:
  - url: https://api.example.com
tags:
  - name: health
    description: ヘルスチェック
  - name: stop-points
    description: 一時停止警告対象地点
paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: データベースへの疎通を確認して結果を返す。
      responses:
        "200":
          description: Service and database are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  value:
                    status: ok
                    database: ok
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                degraded:
                  value:
                    status: degraded
                    database: unavailable

  /api/v1/stop-points:
    get:
      tags: [stop-points]
      operationId: getStopPointsByRange
      summary: Get stop points by range
      description: >
        中心座標と検索半径を指定して StopPoint を取得する。
        中心に近い順に返し、距離が等しい地点は内部の識別子順に並べる。
        そのため同じ条件では結果の順序と limit での切り取りが一定になる。
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Long"
        - $ref: "#/components/parameters/Radius"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Stop point list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopPointRangeResponse"
              examples:
                unknownDirection:
                  summary: 方位が未確認の地点。
                  value:
                    - uniqueKey: "SYNTHETIC00000000000000000000001"
                      az: null
                      lat: "1"
                      long: "1"
                      directionStatus: unknown
                    - uniqueKey: "SYNTHETIC00000000000000000000002"
                      az: "197.5"
                      lat: "1.0001"
                      long: "1.0002"
                      directionStatus: inferred
        "400":
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid:
                  value:
                    error:
                      code: invalid_request
                      message: lat is required
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal:
                  value:
                    error:
                      code: internal_error
                      message: Internal Server Error
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    error:
                      code: database_unavailable
                      message: database is temporarily unavailable

  /api/v1/stop-points/{id}:
    get:
      tags: [stop-points]
      operationId: getStopPointById
      summary: Get stop point by ID
      description: raw_uid (uniqueKey) で 1 件取得する。
      parameters:
        - $ref: "#/components/parameters/StopPointId"
      responses:
        "200":
          description: Stop point detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopPointDetailResponse"
              examples:
                unknownDirection:
                  summary: 方位が未確認の地点。
                  value:
                    uniqueKey: "SYNTHETIC00000000000000000000001"
                    az: null
                    lat: "1"
                    long: "1"
                    directionStatus: unknown
        "404":
          description: Stop point not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error:
                      code: not_found
                      message: stop point not found
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal:
                  value:
                    error:
                      code: internal_error
                      message: Internal Server Error
        "503":
          description: Database is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unavailable:
                  value:
                    error:
                      code: database_unavailable
                      message: database is temporarily unavailable

components:
  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: 検索中心の緯度。
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
    Long:
      name: long
      in: query
      required: true
      description: 検索中心の経度。
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
    Radius:
      name: radius
      in: query
      required: true
      description: 検索半径。メートル単位。
      schema:
        type: integer
        format: int32
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      description: 最大取得件数。未指定時は 500。
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 500
    StopPointId:
      name: id
      in: path
      required: true
      description: StopPoint の識別子 (uniqueKey)。
      schema:
        type: string

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          enum: [ok, degraded]
          example: ok
        database:
          type: string
          enum: [ok, unavailable]
          example: ok

    StopPointRangeResponseItem:
      type: object
      description: 範囲検索の 1 件。詳細応答 (StopPointDetailResponse) とは別の型で、現在は同じ項目を持つ。
      required:
        - uniqueKey
        - az
        - lat
        - long
        - directionStatus
      properties:
        uniqueKey:
          type: string
          example: "SYNTHETIC00000000000000000000001"
        az:
          type: string
          nullable: true
          description: >
            方位 (度、10進数の文字列)。方位が不明な地点では null。
            隣接地点への候補方位はここに入らない。
          example: null
        lat:
          type: string
          example: "1"
        long:
          type: string
          example: "1"
        directionStatus:
          $ref: "#/components/schemas/DirectionStatus"

    StopPointRangeResponse:
      type: array
      items:
        $ref: "#/components/schemas/StopPointRangeResponseItem"

    StopPointDetailResponse:
      type: object
      description: 1 件取得の応答。範囲検索の項目 (StopPointRangeResponseItem) とは別の型で、現在は同じ項目を持つ。
      required:
        - uniqueKey
        - az
        - lat
        - long
        - directionStatus
      properties:
        uniqueKey:
          type: string
          example: "SYNTHETIC00000000000000000000001"
        az:
          type: string
          nullable: true
          description: >
            方位 (度、10進数の文字列)。方位が不明な地点では null。
            隣接地点への候補方位はここに入らない。
          example: null
        lat:
          type: string
          example: "1"
        long:
          type: string
          example: "1"
        directionStatus:
          $ref: "#/components/schemas/DirectionStatus"

    DirectionStatus:
      type: string
      enum: [unknown, inferred, confirmed]
      description: >
        az の確からしさ。unknown のとき az は null。
        inferred は推定値、confirmed は現地確認済みの値を表す。
      example: unknown

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - not_found
            - database_unavailable
            - internal_error
        message:
          type: string
