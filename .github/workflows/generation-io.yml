name: generation-io

on:
  pull_request:
    paths:
      - "backend/generation_io/**"
      - ".github/workflows/generation-io.yml"
  push:
    branches:
      - main
    paths:
      - "backend/generation_io/**"
      - ".github/workflows/generation-io.yml"

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    defaults:
      run:
        working-directory: backend/generation_io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.6"
          python-version: "3.13.5"
          enable-cache: false
      - name: Check lock consistency
        run: uv lock --check
      - name: Install locked dependency groups
        run: uv sync --locked --all-groups
      - name: Run standard synthetic test suite
        run: uv run --locked --no-sync python -m pytest -q
