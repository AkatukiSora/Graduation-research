name: direction-candidates

on:
  pull_request:
    paths:
      - "backend/direction_candidates/**"
      - ".github/workflows/direction-candidates.yml"
  push:
    branches: [main]
    paths:
      - "backend/direction_candidates/**"
      - ".github/workflows/direction-candidates.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate frozen review data
        run: python3 backend/direction_candidates/validate.py
      - name: Test validation failures
        run: python3 -m unittest discover -s backend/direction_candidates -p 'test_*.py' -v
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/app/go.mod
          cache-dependency-path: backend/app/go.sum
      - name: Check existing seed logic without a database
        working-directory: backend/app
        run: |
          go test ./internal/seed/... ./internal/seeddata/...
          go run ./cmd/seed --validate-only
